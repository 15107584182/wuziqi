name: Build Tauri Android APK
on:
  workflow_dispatch: # 支持手动点击运行

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r27

      - name: Install dependencies
        run: npm ci

      - name: Tauri Android build
        run: npm run tauri android build -- --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gomuko-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
